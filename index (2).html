<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinese Quiz</title>
<style>
:root{--bg:#fff;--card:#fff;--text:#3c3c3c;--sub:#777;--line:#e5e5e5;--green:#58cc02;--gd:#58a700;--blue:#1cb0f6;--bd:#1899d6;--orange:#ff9600;--od:#cc7900;--red:#ff4b4b;--rd:#ea2b2b;--purple:#ce82ff;--pd:#a568cc;--soft:#f7f7f7;--okbg:#d7ffb8;--nobg:#ffdfe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--card:#1f2c33;--text:#e8eef1;--sub:#9fb0b8;--line:#37464f;--soft:#1a272d;--okbg:#2b4a1a;--nobg:#4a2326}}
:root[data-theme="dark"]{--bg:#131f24;--card:#1f2c33;--text:#e8eef1;--sub:#9fb0b8;--line:#37464f;--soft:#1a272d;--okbg:#2b4a1a;--nobg:#4a2326}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.logo{font-size:22px;font-weight:900;color:var(--green)}
.pill{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px}
.card{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:18px;font-weight:900}
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--line)}
.mission:first-of-type{border-top:0}
.mi{font-size:28px}.mt{flex:1;font-size:15px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar i:after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;background:rgba(255,255,255,.35);border-radius:9px}
.done{color:var(--green)}
.week{display:flex;justify-content:space-between;gap:4px;margin:8px 0 14px}
.day{flex:1;text-align:center;font-size:12px;color:var(--sub)}
.dot{width:34px;height:34px;margin:4px auto 0;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px}
.dot.on{background:var(--orange);border-color:var(--od)}.dot.today{border-color:var(--blue)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;font:inherit;font-weight:900;font-size:16px;letter-spacing:.5px;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--gd);cursor:pointer;transition:transform .08s,box-shadow .08s;text-align:left}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}
.btn.c{text-align:center}.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--bd)}.btn.blue:active{box-shadow:0 1px 0 var(--bd)}
.btn.or{background:var(--orange);box-shadow:0 5px 0 var(--od)}.btn.or:active{box-shadow:0 1px 0 var(--od)}
.btn.pu{background:var(--purple);box-shadow:0 5px 0 var(--pd)}.btn.pu:active{box-shadow:0 1px 0 var(--pd)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--rd)}.btn.red:active{box-shadow:0 1px 0 var(--rd)}
.btn[disabled]{background:var(--line);box-shadow:0 5px 0 var(--sub);color:var(--sub);cursor:not-allowed}
.btn small{display:block;font-weight:700;opacity:.9;font-size:12px;margin-top:2px}
.lv{display:grid;gap:14px}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{background:none;border:0;font-size:26px;color:var(--sub);cursor:pointer;font-weight:900}
.qtop .bar{flex:1;margin:0;height:16px}
.q{font-size:22px;font-weight:900;margin:6px 0 14px;line-height:1.35}
.tag{display:inline-block;font-size:12px;font-weight:900;padding:3px 10px;border-radius:99px;background:var(--soft);border:2px solid var(--line);color:var(--sub);margin-bottom:8px}
.spk{background:var(--blue);border:0;border-radius:12px;color:#fff;font-size:18px;padding:6px 12px;box-shadow:0 3px 0 var(--bd);cursor:pointer;margin-left:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;font-size:17px;font-weight:800;color:var(--text);cursor:pointer;text-align:left;transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt b{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);flex:none}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.12)}
.opt.ok{border-color:var(--green);background:var(--okbg)}.opt.no{border-color:var(--red);background:var(--nobg)}
.ans{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.chip{border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--card);color:var(--text);font:inherit;font-size:20px;font-weight:900;padding:8px 14px;cursor:pointer;animation:pop .25s}
.chip.used{opacity:.25;pointer-events:none;border-bottom-width:2px}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.3,1.3,.5,1);z-index:20}
.feedback.show{transform:none}.feedback.ok{background:var(--okbg);color:var(--gd)}.feedback.no{background:var(--nobg);color:var(--rd)}
.feedback .in{max-width:528px;margin:0 auto}.feedback h3{margin:0 0 4px;font-size:20px;font-weight:900}.feedback p{margin:0 0 12px;font-size:14px;font-weight:700}
.big{text-align:center;padding:20px 0}.big .em{font-size:80px;animation:bounce 1s infinite}
.stats{display:flex;gap:10px;margin:16px 0}.stats div{flex:1;border:2px solid;border-radius:16px;padding:10px 4px;text-align:center;font-weight:900}
.stats span{display:block;font-size:12px;margin-bottom:4px}
.shake{animation:shake .4s}.hide{display:none}
.confetti{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:50;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes bounce{50%{transform:translateY(-14px) scale(1.08)}}
@keyframes flame{50%{transform:scale(1.2) rotate(-6deg)}}
.flame{display:inline-block;animation:flame 1.2s infinite}
:root[data-skin=ocean]{--green:#1cb0f6;--gd:#1899d6;--okbg:#d8f1ff;--bg:#eef9ff;--blue:#7c6cff;--bd:#5b4be0}
:root[data-skin=sakura]{--green:#ff6fa5;--gd:#e0467f;--okbg:#ffe0ec;--bg:#fff5f9;--blue:#b388ff;--bd:#8f63e0}
:root[data-skin=sunset]{--green:#ff8a00;--gd:#cc6e00;--okbg:#ffe8c7;--bg:#fff7ec;--blue:#e8576a;--bd:#c2394c}
:root[data-skin=night]{--green:#9b7bff;--gd:#7857e0;--okbg:#352a66;--nobg:#4a2326;--blue:#3fd0e6;--bd:#26a8bd;--bg:#0f1226;--card:#1a1e3a;--soft:#151833;--line:#2f3563;--text:#eef0ff;--sub:#a7acd6}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco span{position:absolute;bottom:-50px;opacity:.2;animation:rise 14s linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
.wrap{position:relative;z-index:1}
.hero{display:flex;gap:14px;align-items:center}.mascot{font-size:56px;animation:bounce 2.2s infinite}
.skins{display:flex;gap:10px;flex-wrap:wrap}.sk{width:54px;height:54px;border-radius:16px;border:3px solid transparent;font-size:27px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .15s}.sk.on{border-color:var(--text);transform:scale(1.12)}
@media(min-width:700px){.lv{grid-template-columns:repeat(3,1fr)}.wrap{max-width:640px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="feedback" id="fb"><div class="in"><h3 id="fbt"></h3><p id="fbp"></p><button class="btn c" id="fbb">계속하기</button></div></div>
<script>
/* ============ 1) 퀴즈 데이터 (여기에 문제를 추가하세요) ============
 l: low/mid/high  t: mc(객관식) | bd(단어 조합)
 mc: {q 질문, py 병음/힌트, o 선택지[], a 정답 인덱스(0부터), e 해설, say 읽어줄 중국어(선택)}
 bd: {q 한국어 뜻, w 조각[], a 정답 문장(조각을 이어붙인 것), py 병음, e 해설} */
const QUIZ=[
{l:'low',t:'mc',q:'"你好"의 병음은?',o:['nǐ hǎo','ní hào','nī hāo','nì hǎo'],a:0,say:'你好',e:'你好 nǐ hǎo = 안녕하세요. 3성+3성이 이어지면 앞 3성은 2성처럼(ní hǎo) 읽혀요.'},
{l:'low',t:'mc',q:'"고마워요"를 중국어로?',o:['谢谢','对不起','再见','没关系'],a:0,say:'谢谢',py:'xièxie',e:'谢谢 xièxie = 고마워요. 对不起는 미안해요, 没关系는 괜찮아요.'},
{l:'low',t:'mc',q:'헤어질 때 하는 인사는?',o:['你好','再见','早上好','请问'],a:1,say:'再见',py:'zàijiàn',e:'再见 zàijiàn = 안녕히 가세요 / 또 봐요.'},
{l:'low',t:'mc',q:'"말(馬)"의 병음은?',o:['mā','má','mǎ','mà'],a:2,say:'马',e:'马 mǎ 3성. 妈 mā(1성, 엄마), 麻 má(2성), 骂 mà(4성)와 성조로 구분해요!'},
{l:'low',t:'bd',q:'저는 학생이에요.',w:['我','是','学生','你','吗'],a:'我是学生',py:'Wǒ shì xuésheng',e:'我(나) + 是(~이다) + 学生(학생). 你와 吗는 함정!'},
{l:'low',t:'mc',q:'"물"은 중국어로?',o:['火 huǒ','水 shuǐ','茶 chá','饭 fàn'],a:1,say:'水',e:'水 shuǐ = 물, 火 huǒ = 불, 茶 chá = 차, 饭 fàn = 밥.'},
{l:'low',t:'mc',q:'아침에 하는 인사는?',o:['晚上好','晚安','早上好','下午好'],a:2,say:'早上好',py:'zǎoshang hǎo',e:'早上好 = 좋은 아침. 晚安은 잘 자요(밤 인사)!'},
{l:'low',t:'bd',q:'잘 지내요?',w:['你','好','吗','我','的'],a:'你好吗',py:'Nǐ hǎo ma',e:'문장 끝의 吗(ma)를 붙이면 의문문이 돼요.'},
{l:'mid',t:'mc',q:'🍜 식당에서 "계산해 주세요"는?',o:['买单','点菜','打包','加油'],a:0,say:'买单',py:'mǎidān',e:'买单 mǎidān = 계산하다. 点菜는 주문, 打包는 포장해 가기.'},
{l:'mid',t:'bd',q:'🛍️ 이거 얼마예요?',w:['这个','多少','钱','吗','在'],a:'这个多少钱',py:'Zhège duōshao qián',e:'多少钱 = 얼마예요? 의문사가 있으면 吗는 필요 없어요.'},
{l:'mid',t:'mc',q:'🚕 택시에서 "기사님, 공항 가주세요"는?',o:['师傅，我是机场','师傅，去机场','师傅，机场吗','师傅，机场多少'],a:1,say:'师傅，去机场',py:'Shīfu, qù jīchǎng',e:'기사님을 부를 땐 师傅! 去 + 장소 = ~로 가 주세요.'},
{l:'mid',t:'mc',q:'🛍️ 가격이 비싸서 "좀 깎아 주세요"는?',o:['便宜一点儿吧','太贵了','我要这个','不用找了'],a:0,say:'便宜一点儿吧',py:'piányi yìdiǎnr ba',e:'便宜一点儿吧 = 좀 싸게 해 주세요. 不用找了는 거스름돈 안 주셔도 돼요.'},
{l:'mid',t:'mc',q:'문장 완성: 我 ____ 喝咖啡。(커피 마시는 걸 좋아해요)',o:['喜欢','知道','认识','觉得'],a:0,say:'我喜欢喝咖啡',py:'wǒ xǐhuan hē kāfēi',e:'喜欢 + 동사 = ~하는 것을 좋아하다.'},
{l:'mid',t:'mc',q:'좁은 길에서 사람 사이를 지나가며 "실례합니다"에 가장 자연스러운 말은?',o:['不好意思','对不起','谢谢你','再见'],a:0,say:'不好意思',py:'bù hǎoyìsi',e:'가벼운 실례·양해는 不好意思! 对不起는 진짜 잘못했을 때 쓰는 사과예요.'},
{l:'mid',t:'bd',q:'🚻 화장실이 어디예요?',w:['洗手间','在','哪儿','我','吗'],a:'洗手间在哪儿',py:'Xǐshǒujiān zài nǎr',e:'~在哪儿? = ~는 어디예요?'},
{l:'mid',t:'mc',q:'📞 전화를 받을 때 "여보세요"는?',o:['喂','好','嗯','哦'],a:0,say:'喂',py:'wéi / wèi',e:'喂 wéi(wèi) = 여보세요.'},
{l:'high',t:'mc',q:'친구가 갑자기 "我去！"라고 외쳤다. 무슨 뜻?',o:['나 갈게!','헐! 대박! (놀람)','나 화장실 가','내가 갈 거야'],a:1,say:'我去',e:'我去는 깜짝 놀랐을 때 쓰는 구어체 감탄사. 글자 그대로 "내가 간다"가 아니에요!'},
{l:'high',t:'mc',q:'SNS 유행어 "绝绝子"의 뜻은?',o:['완전 최고야 / 미쳤다(칭찬)','절대 안 돼','매우 지루해','완전 망했어'],a:0,say:'绝绝子',e:'绝绝子 juéjuézǐ = 대박·미쳤다. 칭찬에도, 반어적으로도 써요.'},
{l:'high',t:'mc',q:'"yyds"는 무엇의 약자일까?',o:['有一点点烧','永远的神','要有多少','因为都是'],a:1,say:'永远的神',e:'永远的神 yǒngyuǎn de shén = 영원한 신 → "레전드, 최고!"'},
{l:'high',t:'mc',q:'"内卷"의 의미로 가장 알맞은 것은?',o:['집에서 쉬기','과열 경쟁, 소모적 경쟁','말아서 먹는 음식','안쪽으로 말기'],a:1,say:'内卷',py:'nèijuǎn',e:'内卷 = 모두가 필요 이상으로 경쟁해 피곤해지는 현상.'},
{l:'high',t:'mc',q:'친구가 "你在干嘛呢？"라고 묻는다. 가장 자연스러운 대답은?',o:['我是干嘛','没干嘛，刷手机呢','干嘛干嘛','你好吗'],a:1,say:'没干嘛，刷手机呢',py:'méi gànma, shuā shǒujī ne',e:'干嘛 = 뭐 해? 刷手机 = 폰 보며 스크롤하다. 呢로 진행형 느낌!'},
{l:'high',t:'mc',q:'"躺平"의 뜻은?',o:['눕다(말 그대로)','치열한 경쟁을 포기하고 최소한만 하며 살기','운동 열심히 하기','잠을 일찍 자기'],a:1,say:'躺平',py:'tǎngpíng',e:'躺平 = 드러눕기 → 성공 경쟁에서 내려와 여유롭게 사는 태도.'},
{l:'high',t:'bd',q:'웃겨 죽겠다!',w:['笑死','我','了','吗','很'],a:'笑死我了',py:'Xiàosǐ wǒ le',e:'~死我了 = ~해 죽겠어. 笑死我了 = 웃겨 죽겠다!'},
{l:'high',t:'mc',q:'어이없는 상황에서 "我服了"는 어떤 느낌?',o:['옷을 입었다','진짜 두 손 들었다 / 못 말려','복 받았다','서비스가 좋다'],a:1,say:'我服了',e:'我服了 = 감탄/어이없음 모두 가능. 말투에 따라 "대단하다" 또는 "못 말린다".'},
{l:'low',t:'mc',q:'"我"의 뜻은?',o:['너','나','그','우리'],a:1,say:'我',e:'我 wǒ = 나. 你 nǐ = 너, 他 tā = 그.'},
{l:'low',t:'mc',q:'"엄마"는 중국어로?',o:['爸爸','哥哥','妈妈','姐姐'],a:2,say:'妈妈',py:'māma',e:'妈妈 māma = 엄마, 爸爸 bàba = 아빠, 哥哥 = 형/오빠, 姐姐 = 누나/언니.'},
{l:'low',t:'mc',q:'"三"은 숫자 몇일까요?',o:['1','2','3','4'],a:2,say:'三',py:'sān',e:'一 yī, 二 èr, 三 sān, 四 sì.'},
{l:'low',t:'mc',q:'숫자 10 "十"의 병음은?',o:['shí','sì','shì','xī'],a:0,say:'十',e:'十 shí = 10, 四 sì = 4. 혀를 말아 내는 sh와 s를 구분해요.'},
{l:'low',t:'mc',q:'"미안해요"는?',o:['谢谢','对不起','不客气','再见'],a:1,say:'对不起',py:'duìbuqǐ',e:'对不起 = 미안해요. 대답은 没关系(괜찮아요).'},
{l:'low',t:'mc',q:'"괜찮아요"는?',o:['没关系','不好','对不起','请问'],a:0,say:'没关系',py:'méi guānxi',e:'没关系 = 괜찮아요, 상관없어요.'},
{l:'low',t:'bd',q:'그는 선생님이에요.',w:['他','是','老师','吗','你'],a:'他是老师',py:'Tā shì lǎoshī',e:'他 + 是 + 직업.'},
{l:'low',t:'mc',q:'"밥을 먹다"는?',o:['喝水','吃饭','睡觉','看书'],a:1,say:'吃饭',py:'chīfàn',e:'吃饭 chīfàn = 밥 먹다, 喝水 = 물 마시다, 睡觉 = 자다, 看书 = 책 보다.'},
{l:'low',t:'mc',q:'"물을 마시다"는?',o:['喝水','吃水','看水','听水'],a:0,say:'喝水',py:'hē shuǐ',e:'마시다는 喝 hē, 먹다는 吃 chī.'},

if(S.day.d!==today)S.day={d:today,quiz:0,hard:0,correct:0,checkin:0};
const save=()=>{try{localStorage.setItem('zhquiz',JSON.stringify(S))}catch(e){}};
function missions(){const n=Math.floor(new Date().setHours(0,0,0,0)/864e5),a=n%MISSION_POOL.length;let b=(n+1)%MISSION_POOL.length;return[MISSION_POOL[a],MISSION_POOL[b],CHECKIN]}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ============ 4) 효과 ============ */
let AC;function beep(f,d,t){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sOK=()=>{beep(660,.12);setTimeout(()=>beep(880,.18),110)},sNO=()=>{beep(220,.3,'sawtooth')},sTap=()=>beep(500,.05);
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function confetti(){const e=['🎉','⭐','✨','🔥','🎊','💚'];for(let i=0;i<36;i++){const s=document.createElement('span');s.className='confetti';s.textContent=e[i%e.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2800)}}

/* ===== 테마 · 마스코트 ===== */
const SK={classic:{n:'기본',m:'🐼',c:'#58cc02',d:['🐼','🍜','🏮','🥟','🎋','🧧']},ocean:{n:'바다',m:'🐬',c:'#1cb0f6',d:['🐬','🐠','🌊','🐚','⭐','🫧']},sakura:{n:'벚꽃',m:'🐰',c:'#ff6fa5',d:['🌸','🎀','🐰','🍡','💮','✨']},sunset:{n:'노을',m:'🦊',c:'#ff8a00',d:['🦊','🌇','🍊','🔥','☀️','🍂']},night:{n:'밤하늘',m:'🦉',c:'#9b7bff',d:['🦉','🌙','⭐','🪐','✨','🌌']}};
function applySkin(k){S.skin=k;save();const h=document.documentElement;h.dataset.skin=k;if(k==='classic')h.removeAttribute('data-theme');else h.dataset.theme='light';
 let d=$('#deco');if(!d){d=document.createElement('div');d.id='deco';document.body.prepend(d)}
 d.innerHTML=SK[k].d.map((e,i)=>'<span style="left:'+(6+i*16)+'%;animation-delay:'+(-i*2.4)+'s;font-size:'+(22+i%3*9)+'px">'+e+'</span>').join('')}
function hero(){const k=S.skin||'classic',lvl=Math.floor(S.xp/100)+1,p=S.xp%100,T=['새싹 학습자','초보 여행자','회화 도전자','중국어 고수','전설의 통역사'][Math.min(Math.floor(S.xp/150),4)];
 return `<div class="card hero"><div class="mascot">${SK[k].m}</div><div style="flex:1"><div style="font-weight:900">Lv.${lvl} · ${T}</div><div class="bar"><i style="width:${p}%"></i></div><small style="color:var(--sub)">다음 레벨까지 ${100-p} XP</small></div></div>`}
/* ============ 5) 홈 ============ */
function home(){
 const ms=missions(),doneCnt=ms.filter(m=>S.day[m.key]>=m.goal).length;
 const week=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);week.push(d)}
 const names=['일','월','화','수','목','금','토'],checkedToday=S.checked.includes(today);
 app.innerHTML=`
 <div class="top"><div class="logo">你好! 중국어</div><div style="display:flex;gap:8px"><span class="pill"><span class="flame">🔥</span> ${S.streak}</span><span class="pill">⭐ ${S.xp}</span></div></div>
 ${hero()}<div class="card"><h2>📅 오늘의 미션 <span style="color:var(--sub);font-size:14px">${doneCnt}/${ms.length}</span></h2>
 ${ms.map(m=>{const p=Math.min(S.day[m.key],m.goal);return`<div class="mission"><div class="mi">${p>=m.goal?'✅':m.icon}</div><div class="mt ${p>=m.goal?'done':''}">${m.text}<div class="bar"><i style="width:${p/m.goal*100}%"></i></div></div><div style="color:var(--sub)">${p}/${m.goal}</div></div>`}).join('')}</div>
 <div class="card"><h2>🔥 출석 · 연속 ${S.streak}일</h2>
 <div class="week">${week.map(d=>{const k=key(d),on=S.checked.includes(k);return`<div class="day">${names[d.getDay()]}<div class="dot ${on?'on':''} ${k===today?'today':''}">${on?'🔥':''}</div></div>`}).join('')}</div>
 <button class="btn c or" id="ci" ${checkedToday?'disabled':''}>${checkedToday?'오늘 출석 완료 ✔':'출석 체크하기'}</button></div>
 <h2 style="margin:20px 4px 12px">🎮 난이도 선택</h2>
 <div class="lv">${Object.entries(LEVELS).map(([k,v])=>`<button class="btn ${v.c}" data-l="${k}">${v.i} ${v.n}<small>${v.d}</small></button>`).join('')}</div><div style="height:14px"></div><button class="btn c or" id="rnd">🎲 랜덤 믹스<small>모든 난이도를 무작위로 섞어서 도전!</small></button><div class="card" style="margin-top:18px"><h2>🎨 테마 꾸미기</h2><div class="skins">${Object.entries(SK).map(([k,v])=>`<button class="sk ${(S.skin||'classic')===k?'on':''}" data-sk="${k}" title="${v.n}" style="background:${v.c}">${v.m}</button>`).join('')}</div></div>`;
 const ci=$('#ci');if(ci)ci.onclick=checkin;
 $('#rnd').onclick=()=>start('mix');
 app.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{applySkin(b.dataset.sk);sTap();home()});
 app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(b.dataset.l));
}
function checkin(){
 const y=new Date();y.setDate(y.getDate()-1);
 S.streak=S.last===key(y)?S.streak+1:1;S.last=today;S.checked.push(today);S.day.checkin=1;S.xp+=10;save();sOK();confetti();home();
}

/* ============ 6) 퀴즈 ============ */
let Q,i,ok,lv,sel,built,locked;
const SEEN=new Set();
function prep(q){if(q.t!=='mc')return q;const x=sh(q.o.map((_,k)=>k));return Object.assign({},q,{o:x.map(k=>q.o[k]),a:x.indexOf(q.a)})}
function start(l){lv=l;const all=ALL.filter(q=>l==='mix'||q.l===l);let p=all.filter(q=>!SEEN.has(q.q+q.a));if(p.length<PER){all.forEach(q=>SEEN.delete(q.q+q.a));p=all}
 const pk=sh(p).slice(0,PER);pk.forEach(q=>SEEN.add(q.q+q.a));Q=pk.map(prep);i=0;ok=0;show()}
function show(){
 locked=false;sel=null;built=[];$('#fb').className='feedback';
 const q=Q[i];
 let body='';
 if(q.t==='mc')body=`<div class="tag">상황 · 표현 고르기</div><div class="q">${q.q}${q.say?`<button class="spk" data-s="${q.say}">🔊</button>`:''}</div>${q.py?`<div style="color:var(--sub);margin:-6px 0 12px">${q.py}</div>`:''}<div id="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${k+1}</b>${o}</button>`).join('')}</div><button class="btn c" id="chk" disabled>확인</button>`;
 else body=`<div class="tag">단어 조각 조합</div><div class="q">"${q.q}"를 중국어로 만들어 보세요</div><div class="ans" id="ans"></div><div class="pool" id="pool">${sh(q.w.map((w,k)=>k)).map(k=>`<button class="chip" data-k="${k}">${q.w[k]}</button>`).join('')}</div><div style="height:18px"></div><button class="btn c" id="chk" disabled>확인</button>`;
 app.innerHTML=`<div class="qtop"><button class="x" id="quit">✕</button><div class="bar"><i style="width:${i/PER*100}%"></i></div><span class="pill">${lv==='mix'?'🎲':LEVELS[lv].i}</span></div>${body}<div style="height:140px"></div>`;
 $('#quit').onclick=()=>{if(confirm('퀴즈를 그만할까요?')){$('#fb').className='feedback';home()}};
 app.querySelectorAll('.spk').forEach(b=>b.onclick=()=>say(b.dataset.s));
 if(q.t==='mc')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;sTap();app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.k;$('#chk').disabled=false});
 else app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>tapChip(c));
 $('#chk').onclick=check;
}
function tapChip(c){
 if(locked)return;sTap();const k=+c.dataset.k,q=Q[i];
 if(c.parentElement.id==='pool'){built.push(k);const n=c.cloneNode(true);n.onclick=()=>tapChip(n);n.dataset.src='1';$('#ans').appendChild(n);c.classList.add('used')}
 else{built.splice(built.indexOf(k),1);c.remove();app.querySelector('#pool .chip[data-k="'+k+'"]').classList.remove('used')}
 $('#chk').disabled=!built.length;
}
function check(){
 if(locked)return;locked=true;const q=Q[i];let good;
 if(q.t==='mc'){good=sel===q.a;app.querySelectorAll('.opt').forEach((b,k)=>{if(k===q.a)b.classList.add('ok');else if(k===sel)b.classList.add('no')})}
 else good=built.map(k=>q.w[k]).join('')===q.a;
 if(good){ok++;S.xp+=5;sOK()}else{sNO();app.classList.add('shake');setTimeout(()=>app.classList.remove('shake'),400)}
 const ans=q.t==='mc'?q.o[q.a]:q.a+(q.py?' ('+q.py+')':'');
 $('#fbt').textContent=good?'🎉 정답이에요!':'😢 아쉬워요';
 $('#fbp').innerHTML=(good?'':'정답: '+ans+'<br>')+q.e;
 const f=$('#fb');f.className='feedback show '+(good?'ok':'no');
 const b=$('#fbb');b.className='btn c '+(good?'':'red');
 b.onclick=()=>{f.className='feedback';i++;i<Q.length?show():finish()};
 const chk=$('#chk');if(chk)chk.disabled=true;
 if(q.say&&q.t==='mc'&&good)say(q.say);
}
function finish(){
 S.day.quiz++;S.day.correct+=ok;if(lv==='high')S.day.hard++;S.xp+=20;save();
 const perfect=ok===Q.length;if(ok>=3)confetti();
 app.innerHTML=`<div class="big"><div class="em">${perfect?'🏆':ok>=3?'🎉':'💪'}</div><h2 style="font-size:26px">${perfect?'완벽해요!':ok>=3?'잘했어요!':'다시 도전해요!'}</h2>
 <div class="stats"><div style="color:var(--green);border-color:var(--green)"><span>정답</span>${ok}/${Q.length}</div><div style="color:var(--orange);border-color:var(--orange)"><span>획득 XP</span>+${ok*5+20}</div><div style="color:var(--blue);border-color:var(--blue)"><span>연속</span>🔥${S.streak}</div></div></div>
 <button class="btn c" id="again">한 번 더!</button><div style="height:12px"></div><button class="btn c blue" id="hm">홈으로</button>`;
 $('#again').onclick=()=>start(lv);$('#hm').onclick=home;
}
applySkin(S.skin||'classic');home();
</script>
</body>
</html>
